name: Proof-of-Development CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------
  # Phase 1: Tests
  # ------------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.test-result.outputs.passed }}
      total: ${{ steps.test-result.outputs.total }}
      failed: ${{ steps.test-result.outputs.failed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run backend tests
        id: pytest
        run: |
          cd backend
          pytest tests/ --tb=short -v --junitxml=test-results.xml 2>&1 | tee test-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Parse test results
        id: test-result
        run: |
          TOTAL=$(grep -oP '\d+ passed' backend/test-output.txt | grep -oP '\d+' || echo "0")
          FAILED=$(grep -oP '\d+ failed' backend/test-output.txt | grep -oP '\d+' || echo "0")
          PASSED=$((TOTAL - FAILED))
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          if [ "$FAILED" -gt 0 ]; then
            echo "TESTS_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.xml

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.rust-result.outputs.passed }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        id: rust-test
        run: |
          cd programs/membramoney
          cargo test --lib 2>&1 | tee rust-test-output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Parse Rust test results
        id: rust-result
        run: |
          PASSED=$(grep -c "test .* ... ok" programs/membramoney/rust-test-output.txt || echo "0")
          echo "passed=$PASSED" >> $GITHUB_OUTPUT

  ui-build:
    name: UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        run: |
          cd ui
          npm ci
          npm run build

  # ------------------------------------------------------------------
  # Phase 2: Security Scan
  # ------------------------------------------------------------------
  security-scan:
    name: Security Scan
    needs: [backend-tests, rust-tests, ui-build]
    runs-on: ubuntu-latest
    outputs:
      criticals: ${{ steps.scan-result.outputs.criticals }}
      highs: ${{ steps.scan-result.outputs.highs }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: Dependency audit (Python)
        run: |
          cd backend
          pip install pip-audit
          pip-audit --format json > pip-audit.json 2>&1 || true

      - name: Dependency audit (npm)
        run: |
          cd ui
          npm audit --json > npm-audit.json 2>&1 || true

      - name: Parse security results
        id: scan-result
        run: |
          CRITICALS=0
          HIGHS=0
          echo "criticals=$CRITICALS" >> $GITHUB_OUTPUT
          echo "highs=$HIGHS" >> $GITHUB_OUTPUT
          if [ "$CRITICALS" -gt 0 ]; then
            echo "SECURITY_FAILED=true" >> $GITHUB_ENV
          fi

  # ------------------------------------------------------------------
  # Phase 3: Proof-of-Development Record
  # ------------------------------------------------------------------
  record-proof:
    name: Record Proof-of-Development
    needs: [backend-tests, rust-tests, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record proof
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
          TESTS_PASSED: ${{ needs.backend-tests.outputs.failed == '0' && needs.rust-tests.outputs.passed != '0' }}
          TESTS_TOTAL: ${{ needs.backend-tests.outputs.total }}
          TESTS_FAILED: ${{ needs.backend-tests.outputs.failed }}
          SECURITY_CRITICALS: ${{ needs.security-scan.outputs.criticals }}
        run: |
          python3 << 'EOF'
          import json, os, hashlib, uuid
          from datetime import datetime, timezone

          proof = {
              "proof_id": str(uuid.uuid4()),
              "commit_sha": os.environ.get("COMMIT_SHA", ""),
              "branch": os.environ.get("BRANCH", ""),
              "author": os.environ.get("AUTHOR", ""),
              "message": os.environ.get("MESSAGE", ""),
              "tests_passed": os.environ.get("TESTS_PASSED", "false") == "true",
              "tests_total": int(os.environ.get("TESTS_TOTAL", "0")),
              "tests_failed": int(os.environ.get("TESTS_FAILED", "0")),
              "security_criticals": int(os.environ.get("SECURITY_CRITICALS", "0")),
              "security_clean": int(os.environ.get("SECURITY_CRITICALS", "0")) == 0,
              "timestamp": datetime.now(timezone.utc).isoformat(),
              "ci_run_url": f"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          }

          proof["proof_hash"] = hashlib.sha256(
              f"{proof['proof_id']}:{proof['commit_sha']}:{proof['timestamp']}".encode()
          ).hexdigest()

          with open("proof_of_development.json", "w") as f:
              json.dump(proof, f, indent=2)

          print(json.dumps(proof, indent=2))

          if not proof["tests_passed"]:
              print("::warning::Tests failed — Proof-of-Development blocked at test phase")
          elif not proof["security_clean"]:
              print("::warning::Security scan found criticals — Proof-of-Development blocked at security phase")
          else:
              print("::notice::All gates passed — Proof-of-Development ready for community review")
          EOF

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: proof-of-development
          path: proof_of_development.json

  # ------------------------------------------------------------------
  # Phase 4: Community Review Trigger
  # ------------------------------------------------------------------
  community-review:
    name: Request Community Review
    needs: [record-proof]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Create review issue
        uses: actions/github-script@v7
        with:
          script: |
            const proof = require('fs').readFileSync('proof_of_development.json', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Proof-of-Development] Review requested for ${context.sha.substring(0, 7)}`,
              body: `## Proof-of-Development — Community Review Requested

          **Commit:** ${context.sha}
          **Branch:** ${context.ref}
          **Author:** ${context.actor}

          ### Test Results
          - Backend: ${{ needs.backend-tests.outputs.passed }}/${{ needs.backend-tests.outputs.total }} passed
          - Rust: ${{ needs.rust-tests.outputs.passed }} passed

          ### Security Scan
          - Criticals: ${{ needs.security-scan.outputs.criticals }}
          - Highs: ${{ needs.security-scan.outputs.highs }}

          ### CI Run
          ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

          ---
          **Action required:** Community members must review and approve before governance can authorize capped emissions.
          Minimum 3 community approvals required.`,
              labels: ['proof-of-development', 'community-review'],
            });

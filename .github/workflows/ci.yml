name: CI

on:
  push:
    branches: [main, devnet]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo checks when Rust workspace exists
        run: |
          if [ -f Cargo.toml ]; then
            cargo check
            cargo test --lib
          else
            echo "No Cargo.toml found; skipping Rust checks."
          fi

  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install and test backend when present
        run: |
          if [ -d backend ] && [ -f backend/requirements.txt ]; then
            cd backend
            pip install -r requirements.txt
            if [ -d tests ]; then
              pytest tests/ -v --tb=short
            else
              echo "No backend/tests directory found; skipping pytest."
            fi
          else
            echo "No backend requirements found; skipping backend checks."
          fi

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install and build frontend when present
        run: |
          if [ -d ui ] && [ -f ui/package.json ]; then
            cd ui
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build --if-present
          else
            echo "No ui/package.json found; skipping frontend build."
          fi

  preflight:
    name: Preflight Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run preflight when script exists
        run: |
          if [ -f scripts/pre_flight_check.sh ]; then
            bash scripts/pre_flight_check.sh
          else
            echo "No scripts/pre_flight_check.sh found; skipping preflight."
          fi

  secrets-scan:
    name: Secret Scan Advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Advisory secret scan
        run: |
          set +e
          grep -rE "(ghp_[a-zA-Z0-9]{36}|private_key|SECRET_KEY)" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --exclude-dir=.next
          FOUND=$?
          if [ "$FOUND" = "0" ]; then
            echo "Potential secrets found. This advisory job is non-blocking, but credentials must be rotated before production."
          else
            echo "No matching secret patterns found."
          fi
          exit 0

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [rust, backend, frontend, preflight, secrets-scan]
    if: always()
    steps:
      - name: Complete CI
        run: |
          echo "CI completed. Component checks are advisory/non-blocking for devnet prototype development."
          exit 0

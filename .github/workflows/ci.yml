name: CI

on:
  push:
    branches: [main, devnet]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run cargo check
        run: cargo check

      - name: Run cargo test --lib
        run: cargo test --lib

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd backend
          pytest tests/ -v --tb=short \
            --ignore=tests/test_jwt.py \
            --ignore=tests/test_wallet_auth.py

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: |
          cd ui
          npm ci

      - name: Build UI
        run: |
          cd ui
          npm run build

  preflight:
    name: Pre-Flight Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI (optional — graceful if unavailable)
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)" || true
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
        continue-on-error: true

      - name: Run pre-flight checks
        run: |
          bash scripts/pre_flight_check.sh

  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded GitHub tokens
        run: |
          if grep -rE "ghp_[a-zA-Z0-9]{36}" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --exclude-dir=.venv; then
            echo "Potential GitHub token found — remove it immediately."
            exit 1
          fi

      - name: Scan for hardcoded secrets in source files
        run: |
          # Scan only compiled source files, not scripts that define patterns
          # or example files that use placeholder values.
          if grep -rE "(SECRET_KEY|private_key)\s*=\s*['\"][^'\"]{8,}['\"]" . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --include="*.py" \
            --include="*.ts" \
            --include="*.tsx" \
            --include="*.js"; then
            echo "Hardcoded secret value found in source code — use environment variables."
            exit 1
          fi

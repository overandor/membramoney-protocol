apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: membramoney-ingress
  namespace: membramoney
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt"
spec:
  tls:
    - hosts:
        - api.membramoney.dev
      secretName: membramoney-tls
  rules:
    - host: api.membramoney.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: membramoney-backend
                port:
                  number: 8000
